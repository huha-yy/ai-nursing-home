{% if agent.needs_restart %}
<div style="background:rgba(210,153,34,0.1);border:1px solid var(--warn);padding:0.7rem 1rem;border-radius:6px;margin-bottom:1rem;display:flex;align-items:center;gap:0.75rem">
  <span style="color:var(--warn);font-size:0.85rem;font-weight:600;flex:1">配置已保存，需要重启 Agent 才能生效</span>
  {% if agent.status == 'active' %}
  <form method="post" action="/api/v1/admin/agents/{{ agent.id }}/restart" style="display:inline">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <button type="submit" class="primary-btn" style="width:auto;padding:0.3rem 0.8rem;font-size:0.8rem">立即重启</button>
  </form>
  {% else %}
  <a href="/admin/agents/{{ agent.id }}" style="font-size:0.85rem">前往 Agent 详情操作</a>
  {% endif %}
</div>
{% endif %}
