{% extends "base.html" %}
{% block title %}AI 养老院院长 — 登录{% endblock %}
{% block head_extra %}
<link rel="stylesheet" href="/static/nursing.css">
{% endblock %}
{% block body_class %}login-page{% endblock %}
{% block body %}
<div class="login-stage" id="login-stage">

  <div class="login-card" id="login-card">
    <h1 class="login-brand">AI 养老院院长</h1>
    <p class="login-sub">杭州社会福利院</p>
    <p class="login-greeting" id="greeting"></p>

    {% if error %}<p class="login-error">{{ error }}</p>{% endif %}

    <form method="post" action="/auth/nursing-login" id="login-form">
      <div class="login-field">
        <label for="login-user" id="login-user-label">用户名</label>
        <input id="login-user" type="text" name="username" autocomplete="username"
               pattern="[A-Za-z0-9_]{1,32}" required autofocus>
      </div>
      <div class="login-field">
        <label for="login-pass">密码</label>
        <input id="login-pass" type="password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="login-btn">登录</button>
    </form>

    <div class="login-modes">
      <a href="#" id="family-link">家属入口</a>
      <a href="#" id="admin-link">管理员入口</a>
    </div>
  </div>

</div>

<script>
(function() {
  var h = new Date().getHours();
  var g = document.getElementById('greeting');
  if      (h < 8)  g.textContent = '早上好，早班辛苦了';
  else if (h < 12) g.textContent = '上午好，请注意查房安排';
  else if (h < 14) g.textContent = '中午好，午间别忘了巡查';
  else if (h < 18) g.textContent = '下午好，今天也辛苦了';
  else             g.textContent = '晚上好，夜班请注意安全';

  // 三态切换：员工(默认) / 管理员 / 家属。家属用手机号登录，
  // 身份在 nursing-erp 侧校验（dl-control 只委托不落库）。
  var admin  = document.getElementById('admin-link');
  var family = document.getElementById('family-link');
  var form   = document.getElementById('login-form');
  var uLabel = document.getElementById('login-user-label');
  var uInput = document.getElementById('login-user');

  function setMode(mode) {
    if (mode === 'admin') {
      form.action = '/login';
      uLabel.textContent = '用户名';
      uInput.placeholder = '';
      admin.textContent = '返回登录';
      family.textContent = '家属入口';
    } else if (mode === 'family') {
      form.action = '/auth/family-login';
      uLabel.textContent = '手机号';
      uInput.placeholder = '请输入家属手机号';
      admin.textContent = '管理员入口';
      family.textContent = '返回员工登录';
    } else {
      form.action = '/auth/nursing-login';
      uLabel.textContent = '用户名';
      uInput.placeholder = '';
      admin.textContent = '管理员入口';
      family.textContent = '家属入口';
    }
  }

  admin.addEventListener('click', function(e) {
    e.preventDefault();
    setMode(form.action.endsWith('/login') ? 'nursing' : 'admin');
  });
  family.addEventListener('click', function(e) {
    e.preventDefault();
    setMode(form.action.endsWith('/auth/family-login') ? 'nursing' : 'family');
  });

  // 3D tilt + parallax
  var stage = document.getElementById('login-stage');
  var card  = document.getElementById('login-card');

  stage.addEventListener('mousemove', function(e) {
    var w = stage.offsetWidth;
    var h = stage.offsetHeight;
    var x = (e.clientX - stage.getBoundingClientRect().left) / w - 0.5;
    var y = (e.clientY - stage.getBoundingClientRect().top)  / h - 0.5;

    card.style.transform = 'rotateY(' + (x * 8) + 'deg) rotateX(' + (-y * 8) + 'deg) translateZ(0)';
    stage.style.setProperty('--mx', (x * -20) + 'px');
    stage.style.setProperty('--my', (y * -20) + 'px');
  });

  stage.addEventListener('mouseleave', function() {
    card.style.transform = 'rotateY(0) rotateX(0) translateZ(0)';
    stage.style.setProperty('--mx', '0px');
    stage.style.setProperty('--my', '0px');
    card.style.transition = 'transform 0.6s cubic-bezier(0.22, 0.61, 0.36, 1)';
    setTimeout(function() { card.style.transition = 'transform 0.1s linear'; }, 600);
  });
})();
</script>
{% endblock %}
