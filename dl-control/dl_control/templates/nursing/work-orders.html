{% extends "base.html" %}
{% block title %}护理工单 — AI 养老院院长{% endblock %}
{% block body %}

<style>
.nh-wo{max-width:1180px;margin:0 auto;padding:1.5rem 1.25rem 3rem}
.nh-wo-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:.6rem}
.nh-wo-back{font-size:.85rem;color:#E67E22;text-decoration:none}
.nh-wo-total{font-size:.78rem;color:#6B5A45}
.nh-wo-ttl{font-size:1.4rem;font-weight:700;color:#4A3728;margin:0 0 .7rem}

/* 当日 KPI 行（跟选中日期走） */
.nh-wo-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem;margin-bottom:.6rem}
.nh-wo-kpi{background:#fff;border:1px solid #E8D5C4;border-radius:10px;padding:.6rem;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.nh-wo-kpi strong{display:block;font-size:1.25rem;font-weight:700;color:#4A3728}
.nh-wo-kpi small{display:block;font-size:.72rem;color:#6B5A45;margin-top:.1rem}
.nh-wo-kpi-ok strong{color:#27AE60}
.nh-wo-kpi-warn strong{color:#E74C3C}
.nh-wo-prog{height:4px;background:#EDE0D3;border-radius:2px;margin-bottom:.9rem;overflow:hidden}
.nh-wo-prog i{display:block;height:100%;background:#27AE60;border-radius:2px;transition:width .3s}

/* ── 三栏：日期侧栏 + 工单列表 + 详情 ── */
.nh-wo-layout{display:grid;grid-template-columns:170px 300px 1fr;gap:1rem;align-items:start}

/* 左：日期侧栏 */
.nh-wo-dates{background:#fff;border:1px solid #E8D5C4;border-radius:10px;padding:.55rem;box-shadow:0 2px 8px rgba(0,0,0,.06);position:sticky;top:1rem;max-height:calc(100vh - 2rem);overflow-y:auto}
.nh-wo-dt{display:block;border:1px solid transparent;border-radius:8px;padding:.45rem .55rem;margin-bottom:.3rem;cursor:pointer}
.nh-wo-dt:hover{background:#FDF6EC}
.nh-wo-dt.sel{background:#FDEBD0;border-color:#F0D9B8}
.nh-wo-dt-top{display:flex;align-items:baseline;gap:.35rem}
.nh-wo-dt-label{font-size:.85rem;font-weight:700;color:#4A3728;flex:1}
.nh-wo-dt-tag{font-size:.64rem;font-weight:700;color:#B9770E;background:#FDF3DC;border-radius:6px;padding:.05rem .3rem;white-space:nowrap}
.nh-wo-dt-sub{font-size:.68rem;color:#6B5A45;margin-top:.12rem}
.nh-wo-dt-sub .pend{color:#E65100;font-weight:700}
.nh-wo-empty-dates{font-size:.75rem;color:#6B5A45;text-align:center;padding:1rem .4rem;line-height:1.7}

/* 中：当日工单列表 */
.nh-wo-mid{background:#fff;border:1px solid #E8D5C4;border-radius:10px;padding:.6rem;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.nh-wo-filt{display:flex;gap:.35rem;margin-bottom:.55rem}
.nh-wo-filt b{border:1px solid #E8D5C4;background:#FFF8F0;color:#6B5A45;padding:.16rem .6rem;border-radius:12px;font-size:.76rem;cursor:pointer;font-weight:600}
.nh-wo-filt b.on{background:#4A3728;color:#fff;border-color:#4A3728}
.nh-wo-list{display:flex;flex-direction:column;gap:.35rem;max-height:calc(100vh - 4.5rem);overflow-y:auto}
.nh-wo-item{border:1px solid transparent;border-left:3px solid #27AE60;border-radius:8px;padding:.45rem .6rem;cursor:pointer}
.nh-wo-item:hover{background:#FDF6EC}
.nh-wo-item.sel{background:#FDEBD0;border-color:#F0D9B8}
.nh-wo-item.pend{border-left-color:#E67E22}
.nh-wo-item.done{opacity:.6}
.nh-wo-item-top{display:flex;align-items:baseline;gap:.4rem}
.nh-wo-i-type{font-size:.85rem;font-weight:700;color:#4A3728;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nh-wo-i-room{font-size:.7rem;color:#6B5A45;white-space:nowrap}
.nh-wo-item-sub{font-size:.72rem;color:#6B5A45;margin-top:.12rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nh-wo-i-st{font-size:.66rem;font-weight:700;padding:.08rem .4rem;border-radius:8px;flex-shrink:0}
.nh-wo-i-st.ok{color:#2E7D32;background:#E8F5E9}
.nh-wo-i-st.pend{color:#E65100;background:#FFF3E0}
.nh-wo-empty-list{font-size:.78rem;color:#6B5A45;text-align:center;padding:1rem .5rem;line-height:1.7}

/* 右：详情 */
.nh-wo-main{background:#fff;border:1px solid #E8D5C4;border-radius:10px;padding:1.1rem 1.25rem;box-shadow:0 2px 8px rgba(0,0,0,.06);min-height:300px}
.nh-wo-detail-head{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin-bottom:.5rem}
.nh-wo-detail-name{font-size:1.1rem;font-weight:700;color:#4A3728}
.nh-wo-detail-building{font-size:.8rem;color:#6B5A45}
.nh-wo-type-tag{font-size:.78rem;padding:.12rem .55rem;border-radius:4px;background:#FDF6EC;color:#B9770E;font-weight:600}
.nh-wo-badge{font-size:.72rem;font-weight:700;padding:.14rem .55rem;border-radius:10px}
.nh-wo-badge.ok{background:#E8F5E9;color:#2E7D32}
.nh-wo-badge.pend{background:#FFF3E0;color:#E65100}
.nh-wo-detail-content{font-size:.92rem;color:#4A3728;line-height:1.7;margin:.7rem 0 .9rem;padding:.7rem .85rem;background:#FFFBF6;border-radius:8px;border:1px solid #F0E8DB}
.nh-wo-meta{font-size:.78rem;color:#6B5A45;line-height:1.9}
.nh-wo-meta b{color:#4A3728;font-weight:600}
.nh-wo-placeholder{text-align:center;padding:3.2rem 1rem;color:#6B5A45;font-size:.9rem}
.nh-wo-spin{display:inline-block;width:20px;height:20px;border:2px solid #E8D5C4;border-top-color:#E67E22;border-radius:50%;animation:wospin .6s linear infinite;margin-right:.4rem;vertical-align:middle}
@keyframes wospin{to{transform:rotate(360deg)}}

/* ── 响应式：窄屏日期变横向 chips，列表/详情纵向堆叠 ── */
@media (max-width:860px){
  .nh-wo-layout{grid-template-columns:1fr}
  .nh-wo-dates{position:static;max-height:none;overflow:visible;display:flex;gap:.35rem;overflow-x:auto;padding-bottom:.25rem}
  .nh-wo-dt{flex-shrink:0;min-width:108px;margin-bottom:0}
  .nh-wo-dt-sub{display:none}
  .nh-wo-list{max-height:none;overflow:visible}
}
</style>

<div class="nh-wo">
  <div class="nh-wo-bar">
    <a href="/dashboard" class="nh-wo-back">← 大屏</a>
    <span class="nh-wo-total" id="wo-total"></span>
  </div>
  <h1 class="nh-wo-ttl">护理工单</h1>

  <div class="nh-wo-kpis">
    <div class="nh-wo-kpi"><strong id="k-total">-</strong><small>当日工单</small></div>
    <div class="nh-wo-kpi nh-wo-kpi-ok"><strong id="k-done">-</strong><small>已完成</small></div>
    <div class="nh-wo-kpi nh-wo-kpi-warn"><strong id="k-pend">-</strong><small>待处理</small></div>
    <div class="nh-wo-kpi"><strong id="k-rate">-</strong><small>完成率</small></div>
  </div>
  <div class="nh-wo-prog"><i id="k-bar" style="width:0%"></i></div>

  <div class="nh-wo-layout">
    <aside class="nh-wo-dates" id="wo-dates"><div class="nh-wo-empty-dates"><span class="nh-wo-spin"></span>加载中…</div></aside>
    <section class="nh-wo-mid">
      <div class="nh-wo-filt" id="wo-filt">
        <b class="on" data-f="all" onclick="setFilt('all')">全部 <span id="n-all"></span></b>
        <b data-f="pending" onclick="setFilt('pending')">待处理 <span id="n-pending"></span></b>
        <b data-f="done" onclick="setFilt('done')">已完成 <span id="n-done"></span></b>
      </div>
      <div class="nh-wo-list" id="wo-list"><div class="nh-wo-empty-list"><span class="nh-wo-spin"></span>加载中…</div></div>
    </section>
    <main class="nh-wo-main" id="wo-main"><div class="nh-wo-placeholder"><span class="nh-wo-spin"></span>加载中…</div></main>
  </div>
</div>

<script>
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

var state = {orders: [], dates: [], selDate: null, selId: null, filt: 'all'};

function dateLabel(iso){
  var today = new Date(); today.setHours(0,0,0,0);
  var d = new Date(iso + 'T00:00:00'); d.setHours(0,0,0,0);
  var diff = Math.round((today - d) / 86400000);
  if (diff === 0) return {label: (d.getMonth()+1)+'月'+d.getDate()+'日', tag: '今天'};
  if (diff === 1) return {label: (d.getMonth()+1)+'月'+d.getDate()+'日', tag: '昨天'};
  var wd = '日一二三四五六'[d.getDay()];
  return {label: (d.getMonth()+1)+'月'+d.getDate()+'日', tag: '周'+wd};
}

function groupDates(){
  var seen = {};
  state.orders.forEach(function(o){
    if (!o.date || seen[o.date]) return;
    seen[o.date] = true;
    var day = state.orders.filter(function(x){return x.date === o.date;});
    var done = day.filter(function(x){return x.completed;}).length;
    state.dates.push({date: o.date, total: day.length, done: done, pend: day.length - done});
  });
}

function dayOrders(){
  return state.orders.filter(function(o){
    if (o.date !== state.selDate) return false;
    if (state.filt === 'pending') return !o.completed;
    if (state.filt === 'done') return o.completed;
    return true;
  });
}

function byId(id){ return state.orders.find(function(o){return o.id === id;}); }

function setFilt(f){
  state.filt = f;
  document.querySelectorAll('#wo-filt b').forEach(function(b){
    b.classList.toggle('on', b.dataset.f === f);
  });
  renderList();
}

function selectDate(d){
  state.selDate = d;
  state.selId = null;
  renderDates();
  renderKpis();
  renderList();
  renderDetail();
  syncHash();
}

function selectOrder(id){
  state.selId = id;
  renderList();
  renderDetail();
  syncHash();
}

function syncHash(){
  var h = '#d=' + (state.selDate || '');
  if (state.selId != null) h += '&o=' + state.selId;
  try { history.replaceState(null, '', h); } catch(e) {}
}

function renderDates(){
  var box = document.getElementById('wo-dates');
  if (!state.dates.length) {
    box.innerHTML = '<div class="nh-wo-empty-dates">近 30 天暂无工单记录</div>';
    return;
  }
  var html = '';
  state.dates.forEach(function(dt){
    var lab = dateLabel(dt.date);
    html += '<div class="nh-wo-dt' + (dt.date === state.selDate ? ' sel' : '') +
            '" onclick="selectDate(\'' + dt.date + '\')">' +
            '<div class="nh-wo-dt-top"><span class="nh-wo-dt-label">' + lab.label + '</span>' +
            '<span class="nh-wo-dt-tag">' + lab.tag + '</span></div>' +
            '<div class="nh-wo-dt-sub">' + dt.total + ' 单 · 完成 ' + dt.done +
            (dt.pend ? ' · <span class="pend">待 ' + dt.pend + '</span>' : '') + '</div></div>';
  });
  box.innerHTML = html;
}

function renderKpis(){
  var dt = state.dates.find(function(x){return x.date === state.selDate;});
  if (!dt) return;
  var rate = dt.total ? Math.round(dt.done / dt.total * 100) : 0;
  document.getElementById('k-total').textContent = dt.total;
  document.getElementById('k-done').textContent = dt.done;
  document.getElementById('k-pend').textContent = dt.pend;
  document.getElementById('k-rate').textContent = rate + '%';
  document.getElementById('k-bar').style.width = rate + '%';
  var pendAll = state.orders.filter(function(o){return !o.completed;}).length;
  document.getElementById('wo-total').textContent =
    '近 ' + state.dates.length + ' 天 ' + state.orders.length + ' 单 · 待处理 ' + pendAll + ' 单';
}

function renderList(){
  var box = document.getElementById('wo-list');
  var day = state.orders.filter(function(o){return o.date === state.selDate;});
  document.getElementById('n-all').textContent = day.length;
  document.getElementById('n-done').textContent = day.filter(function(o){return o.completed;}).length;
  document.getElementById('n-pending').textContent = day.filter(function(o){return !o.completed;}).length;
  var items = dayOrders();
  if (!items.length) {
    box.innerHTML = '<div class="nh-wo-empty-list">' +
      (day.length ? '该筛选下暂无工单' : '当日无工单记录') + '</div>';
    return;
  }
  var html = '';
  items.forEach(function(o){
    html += '<div class="nh-wo-item ' + (o.completed ? 'done' : 'pend') + (o.id === state.selId ? ' sel' : '') +
            '" onclick="selectOrder(' + o.id + ')">' +
            '<div class="nh-wo-item-top">' +
            '<span class="nh-wo-i-type">' + esc(o.type) + '</span>' +
            '<span class="nh-wo-i-room">' + esc(o.room || '-') + ' ' + esc(o.resident || '') + '</span>' +
            '<span class="nh-wo-i-st ' + (o.completed ? 'ok' : 'pend') + '">' + (o.completed ? '已完成' : '待处理') + '</span></div>' +
            '<div class="nh-wo-item-sub">' + esc(o.note || '') + '</div></div>';
  });
  box.innerHTML = html;
}

function renderDetail(){
  var el = document.getElementById('wo-main');
  var o = byId(state.selId);
  if (!o) {
    el.innerHTML = '<div class="nh-wo-placeholder">' +
      (state.orders.length ? '← 从列表选择一张工单' : '暂无工单记录') + '</div>';
    return;
  }
  el.innerHTML =
    '<div class="nh-wo-detail-head">' +
    '<span class="nh-wo-detail-name">' + esc(o.resident || '未关联老人') + '</span>' +
    '<span class="nh-wo-detail-building">' + esc(o.building || '') + ' ' + esc(o.room || '') + '</span>' +
    '<span class="nh-wo-type-tag">' + esc(o.type) + '</span>' +
    '<span class="nh-wo-badge ' + (o.completed ? 'ok' : 'pend') + '">' + (o.completed ? '已完成' : '待处理') + '</span></div>' +
    '<div class="nh-wo-detail-content">' + esc(o.note || '（无护理记录）') + '</div>' +
    '<div class="nh-wo-meta">工单日期　<b>' + esc(o.date) + '</b></div>' +
    '<div class="nh-wo-meta">负责护理员　<b>' + esc(o.staff || '未指派') + '</b></div>';
}

async function refresh(){
  var r = await fetch('/api/nursing/work-orders', {credentials:'same-origin'});
  if (!r.ok) throw new Error('HTTP ' + r.status);
  var d = await r.json();
  state.orders = d.orders || [];
  state.dates = [];
  groupDates();
  renderDates();
  return d;
}

(async function(){
  var datesEl = document.getElementById('wo-dates');
  var listEl = document.getElementById('wo-list');
  var mainEl = document.getElementById('wo-main');
  try {
    await refresh();
    if (!state.dates.length) {
      datesEl.innerHTML = '<div class="nh-wo-empty-dates">近 30 天暂无工单记录</div>';
      listEl.innerHTML = '<div class="nh-wo-empty-list">暂无工单</div>';
      mainEl.innerHTML = '<div class="nh-wo-placeholder">暂无工单记录</div>';
      return;
    }
    // hash 还原（#d=2026-08-24&o=57）；缺省最新一天，选中其首张待处理
    var m = location.hash.match(/^#d=(\d{4}-\d{2}-\d{2})(?:&o=(\d+))?/);
    var d = (m && state.dates.some(function(x){return x.date === m[1];})) ? m[1] : state.dates[0].date;
    selectDate(d);
    if (m && m[2] && byId(parseInt(m[2], 10)) && byId(parseInt(m[2], 10)).date === d) {
      selectOrder(parseInt(m[2], 10));
    } else {
      var pend = dayOrders().filter(function(o){return !o.completed;});
      if (pend.length) selectOrder(pend[0].id);
      else if (state.orders.length) selectOrder(dayOrders()[0] ? dayOrders()[0].id : state.orders[0].id);
    }
  } catch(e) {
    datesEl.innerHTML = '<div class="nh-wo-empty-dates">加载失败</div>';
    listEl.innerHTML = '<div class="nh-wo-empty-list">加载失败</div>';
    mainEl.innerHTML = '<div class="nh-wo-placeholder">加载失败：' + esc(e.message) + '</div>';
  }
})();
</script>

{% endblock %}
